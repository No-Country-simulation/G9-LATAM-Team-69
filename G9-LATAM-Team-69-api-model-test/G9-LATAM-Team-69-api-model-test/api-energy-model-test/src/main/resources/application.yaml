spring:
  application:
    name: pre_Auth_bucket_g9
  datasource:
    # Reemplaza NOMBRE_SERVICIO por una entrada de tnsnames.ora (ej. energiadb_tp).
    # TNS_ADMIN debe apuntar a la carpeta del wallet descomprimido en la VM.
    url: jdbc:oracle:thin:@NOMBRE_SERVICIO?TNS_ADMIN=/home/ubuntu/wallet
    username: ADMIN
    # Contraseña del ADMIN de la BD. NO subir a un repo público (usa variable de entorno en prod).
    password: REEMPLAZA_PASSWORD_ADMIN
  jpa:
    hibernate:
      ddl-auto: update   # crea/actualiza la tabla ANALISIS automáticamente
onnx:
  model:
    # Modelo alojado en OCI Object Storage (Pre-Authenticated Request, solo lectura).
    # Reemplaza la URL por la PAR que copiaste. Spring la resuelve como recurso remoto (UrlResource).
    # Para volver al modelo local, usa: classpath:model/model.onnx
    path: https://objectstorage.sa-santiago-1.oraclecloud.com/p/yk9FwP4djUHe314oie9W_-J2_UB8NJJUV7sWNOJnRepGp0MocvOT6OiT0WCkdYQW/n/axexzonjzvlk/b/Nova-enegia/o/Nova-onnxmodel.onnx
